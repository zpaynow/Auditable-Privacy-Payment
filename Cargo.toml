[workspace]
members = [ "payment", "aggregator", "auditor", "wasm", "tools"]
resolver = "2"

[workspace.dependencies]
aes-gcm = "0.10"
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
ark-bn254 = "0.5"
ark-ed-on-bn254= "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["crh", "r1cs"] }
ark-groth16 = "0.5"
rand_chacha = "0.3"
sha2 = "0.10"
